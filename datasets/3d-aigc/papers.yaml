    summary: "HY-World 2.0 将文本、图像、多视图或视频转化为可重建、可扩展和可交互的三维世界。"
    problem: "世界生成需要同时处理全景假设、相机轨迹、长期视角一致性和最终可导航的三维表示。"
    solution: "系统串联全景生成、轨迹规划、带记忆的 WorldStereo 视角扩展和 WorldMirror 世界合成，最终固化为 3D Gaussian 场景并提供交互渲染。"
