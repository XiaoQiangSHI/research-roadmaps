  - id: scene-dreamer-3d
    title: "3D-SceneDreamer: Text-Driven 3D-Consistent Scene Generation"
    shortTitle: "3D-SceneDreamer"
    date: "2024-03-14"
    arxiv: "2403.09439"
    track: scene-world-generation
    summary: "3D-SceneDreamer 用全局三平面 NeRF 保存场景记忆，并沿相机轨迹生成一致的新视角。"
    problem: "从文本逐视角生成图片会遗忘之前的空间信息，导致场景漂移、重复或多视角不一致。"
    solution: "模型把三平面 NeRF 作为全局三维记忆，用带三维条件的扩散模型补全新视图，再把结果写回 NeRF 形成闭环。"
    institutions:
