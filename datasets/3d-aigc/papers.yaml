    summary: "Hunyuan3D 2.0 先生成物体白模，再用多视角扩散和 UV 融合得到高分辨率纹理资产。"
    problem: "同时生成完整几何和高分辨率纹理会让模型负担过重，也容易把视角特定的颜色烘焙进错误位置。"
    solution: "ShapeVAE 与 flow DiT 负责几何，独立的 Paint 模块生成多视角外观并通过 UV 对齐和融合完成纹理贴图。"
