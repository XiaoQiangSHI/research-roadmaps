papers:
  - id: scenesmith
    title: "SceneSmith: Agentic Generation of Simulation-Ready Indoor Scenes"
    shortTitle: "SceneSmith"
    date: "2026-02-09"
    arxiv: "2602.09153"
    track: scene-world-generation
    relatedTracks:
      - object-reconstruction
    summary: "SceneSmith 将自然语言逐级转化为可编辑、可验证且可直接用于机器人仿真的室内三维场景，并为其中的对象配置可用资产和物理属性。"
    problem: "现有文本到场景方法常生成稀疏、静态且缺少碰撞与关节信息的房间，难以覆盖密集杂物、可操作对象和可靠的物理仿真。"
    solution: "系统用层级场景树依次规划房间布局、家具、墙面与顶面物体及支撑面上的小物体；每个阶段由 Designer、Critic 和 Orchestrator 迭代修正，再通过资产路由组合文本到三维生成与 articulated 资产检索，并进行物理属性估计、碰撞检查和重力沉降。"
    institutions:
      primary:
        - mit
      collaborators:
        - toyota-research
    links:
      paper: "https://arxiv.org/abs/2602.09153"
      project: "https://scenesmith.github.io/"
      code: "https://github.com/nepfaff/scenesmith"
      explanations:
        - title: "S-X-Q · SceneSmith：主要原理"
          url: "https://www.cnblogs.com/sxq-blog/p/22846498"
    classification:
      confidence: editorial
      rationale: "主要贡献是从自然语言生成层级化、可编辑且具备物理验证能力的室内三维场景；机器人策略评估是应用验证，资产生成是其中的支撑模块，因此归入场景与世界生成线路，并关联物体级资产生成。"
    sources:
      - type: paper
        url: "https://arxiv.org/abs/2602.09153"
      - type: project
        url: "https://scenesmith.github.io/"
      - type: code
        url: "https://github.com/nepfaff/scenesmith"
      - type: explanation
        url: "https://www.cnblogs.com/sxq-blog/p/22846498"
  - id: meshy-t2
    title: "Meshy T2: Fast Native Mesh Generation with Flow Matching"
    shortTitle: "Meshy T2"
    date: "2026-07-28"
    arxiv: "2607.28675"
    track: object-reconstruction
    summary: "Meshy T2 直接在显式网格的顶点集合上做生成，把单张图像转成可渲染的三角网格。"
    problem: "许多图像到三维方法需要经过密集体素或隐式场，推理慢且难以直接控制网格拓扑。"
    solution: "模型先预测粗 occupancy，再用 Mesh VAE 得到每个顶点的结构化 latent 集合，并用两阶段 flow matching 解码顶点、边和三角面。"
    institutions:
      primary:
        - meshy-ai
    links:
      paper: "https://arxiv.org/abs/2607.28675"
      explanations:
        - title: "S-X-Q · Meshy T2：方法原理简明讲解"
          url: "https://www.cnblogs.com/sxq-blog/p/22844422"
    classification:
      confidence: editorial
      rationale: "论文直接解决从图像快速生成原生显式网格的问题，属于三维物体生成与重建路线。"
    sources:
      - type: paper
        url: "https://arxiv.org/abs/2607.28675"
      - type: explanation
        url: "https://www.cnblogs.com/sxq-blog/p/22844422"
  - id: sam-3d-objects
    title: "SAM 3D: 3Dfy Anything in Images"
    shortTitle: "SAM 3D"
    date: "2025-11-20"
    arxiv: "2511.16624"
    track: object-reconstruction
    summary: "SAM 3D 根据自然场景中的 RGB 图像和目标 mask，重建被遮挡物体的几何、外观与空间布局。"
    problem: "真实照片中的目标常被遮挡、偏离中心并与背景相互作用，物体重建不能只依赖干净的居中图像。"
    solution: "两阶段模型先以条件 flow matching 预测粗占据、旋转、平移和尺度，再在 active voxels 上生成细几何与材质并解码为 mesh 或 3D Gaussian。"
    institutions:
      primary:
        - meta
    links:
      paper: "https://arxiv.org/abs/2511.16624"
      explanations:
        - title: "S-X-Q · SAM 3D Objects"
          url: "https://www.cnblogs.com/sxq-blog/p/22838669"
    classification:
      confidence: editorial
      rationale: "核心贡献是从真实场景图像恢复单个目标的完整三维资产，属于三维物体生成与重建路线。"
    sources:
      - type: paper
        url: "https://arxiv.org/abs/2511.16624"
      - type: explanation
        url: "https://www.cnblogs.com/sxq-blog/p/22838669"
