  - id: worldgrow
    title: "WorldGrow: Generating Infinite 3D World"
    shortTitle: "WorldGrow"
    date: "2025-10-24"
    arxiv: "2510.21682"
    track: scene-world-generation
    summary: "WorldGrow 通过重叠的三维窗口逐块扩展场景，生成在空间上连续且可无限延伸的世界。"
    problem: "整幅大场景难以一次性建模，局部生成又容易在窗口边界产生几何和外观断裂。"
    solution: "方法先生成粗布局，再利用上下文感知的三维 block inpainting 逐块补全，最后以粗到细策略细化结构和外观。"
    institutions:
