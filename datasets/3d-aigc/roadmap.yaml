id: 3d-aigc
name: 3D AIGC 研究路线图
description: 梳理三维表示与潜变量、物体生成与重建、场景与世界生成三条主线中的 3D AIGC 方法演进；文本和多视图先验作为物体路线的关键阶段展开。
kind: full
category: task-domain
scope:
  include:
    - 文本、图像或多视图条件下的三维物体、网格、神经场、3D Gaussian 和场景生成。
    - 直接服务于三维生成的几何、材质、纹理、结构化潜变量和可编辑表示。
    - 能够生成、重建或扩展具有多视角一致性的三维资产、场景或可导航世界的工作。
  exclude:
    - 只做三维检测、分割、定位或感知而不生成三维内容的工作归入计算机视觉。
    - 以几何或材质测量、定位、配准或忠实重建为主要目标，且不服务于生成式补全或资产创作的工作归入计算机视觉。
    - 没有三维输出、只生成二维图像或视频的通用生成工作归入生成模型。
    - 以扩散、流匹配或蒸馏等通用生成机制为主要贡献、三维仅作应用验证的工作归入生成模型。
    - 以渲染器、SLAM、机器人控制或物理交互为主要贡献且不涉及三维内容生成的工作归入相应领域。
  relatedDomains: [computer-vision, generative-models]
period: { start: 2018-01-01, end: 2026-12-31 }
tracks:
  - id: geometry-representation
    index: "01"
    name: 三维表示与生成基础
    color: "#be6246"
    problem: 如何用连续、隐式或结构化表示表达三维形状与材质，并高效提取可用表面。
    evolution:
      - { id: geometry-representation-01, label: 连续 occupancy 与 SDF }
      - { id: geometry-representation-02, label: 可微网格提取 }
      - { id: geometry-representation-03, label: 固定数量 latent 集合 }
      - { id: geometry-representation-04, label: 稀疏空间结构 latent }
      - { id: geometry-representation-05, label: 几何与材质共享结构空间 }
  - id: object-reconstruction
    index: "02"
    name: 三维物体生成与重建
    color: "#3473a0"
    problem: 如何利用文本、图像和多视图先验，快速生成完整、可渲染、可编辑且多视角一致的三维物体资产。
    evolution:
      - { id: object-reconstruction-01, label: 二维扩散文本先验与 SDS }
      - { id: object-reconstruction-02, label: 相机条件新视图与多视图扩散 }
      - { id: object-reconstruction-03, label: 前馈单图重建模型 }
      - { id: object-reconstruction-04, label: 三平面与高效显式表示 }
      - { id: object-reconstruction-05, label: 几何—材质分离与生产级资产 }
  - id: scene-world-generation
    index: "03"
    name: 三维场景与世界生成
    color: "#8e4d73"
    problem: 如何生成大规模、连续、视角一致且可导航或可交互的三维场景和世界，同时控制长期漂移与局部细节。
    evolution:
      - { id: scene-world-generation-01, label: 轨迹驱动的三维场景记忆 }
      - { id: scene-world-generation-02, label: 重叠窗口与场景扩展 }
      - { id: scene-world-generation-03, label: 多模态可导航世界模型 }
editorial:
  note: 论文条目严格来自 S-X-Q 博客园 3D-AIGC 分类页；日期采用对应论文 arXiv 首次公开日期。路线按三条高层主线整理，文本与多视图先验作为物体路线的演进阶段；每篇论文只指定一条主线路，交叉关系以归类理由说明。
  maintainers: [XiaoQiangSHI]
