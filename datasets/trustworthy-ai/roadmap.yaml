id: trustworthy-ai
name: 可信人工智能研究路线图
description: 梳理鲁棒性、安全对齐、可解释性、隐私、公平问责与社会技术评测的关键研究线路。
kind: full
category: cross-cutting
scope:
  include:
    - 跨模型与应用领域的鲁棒性、安全对齐、可解释性、隐私、公平、问责和社会技术评测。
    - 主要贡献是识别、度量、缓解或治理模型风险，而非提升某个任务的平均性能。
  exclude:
    - 只针对某领域准确率、速度或任务泛化的常规改进归入对应任务或系统领域。
    - 生产监控平台与资源可靠性工程归入机器学习系统，除非核心贡献是安全风险检测。
  relatedDomains: [large-language-models, ai-agents, machine-learning-systems]
period: { start: 2014-01-01, end: 2026-12-31 }
tracks:
  - id: robustness
    index: "01"
    name: 鲁棒性与分布外泛化
    color: "#be6246"
    problem: 如何让模型面对扰动、域偏移、长尾和未知输入时保持可靠，并能识别自身不确定性。
    evolution:
      - { id: robustness-01, label: 对抗样本与鲁棒训练 }
      - { id: robustness-02, label: 域泛化与不确定性估计 }
      - { id: robustness-03, label: 基础模型分布偏移与校准 }
  - id: safety
    index: "02"
    name: 对齐、可控性与安全保障
    color: "#3e796d"
    problem: 如何使通用模型遵守意图和约束，抵御越狱与滥用，并为高风险行为提供保障。
    evolution:
      - { id: safety-01, label: 价值学习与人类偏好对齐 }
      - { id: safety-02, label: 宪法式监督与红队测试 }
      - { id: safety-03, label: 可扩展监督、监控与安全证明 }
  - id: interpretability
    index: "03"
    name: 可解释性与机制分析
    color: "#6a63a8"
    problem: 如何理解模型内部表征和决策因果机制，并让解释忠实、稳定且可用于干预。
    evolution:
      - { id: interpretability-01, label: 特征归因与局部解释 }
      - { id: interpretability-02, label: 表征探针与因果干预 }
      - { id: interpretability-03, label: 机制可解释性与自动化分析 }
  - id: privacy
    index: "04"
    name: 隐私与数据安全
    color: "#3473a0"
    problem: 如何减少训练与推理中的敏感信息泄露，抵御成员推断、数据提取和模型反演，并提供可验证的隐私保护。
    evolution:
      - { id: privacy-01, label: 差分隐私与安全聚合 }
      - { id: privacy-02, label: 成员推断、数据提取与隐私审计 }
      - { id: privacy-03, label: 基础模型隐私保护与可删除学习 }
  - id: fairness-accountability
    index: "05"
    name: 公平、问责与社会技术评测
    color: "#526b3d"
    problem: 如何识别和缓解不同群体与使用情境中的系统性伤害，并建立覆盖实际影响、责任和治理要求的评测。
    evolution:
      - { id: fairness-accountability-01, label: 群体公平指标与偏见测量 }
      - { id: fairness-accountability-02, label: 数据与模型审计 }
      - { id: fairness-accountability-03, label: 情境化评测、问责与模型治理 }
editorial:
  note: 当前仅建立初始路线骨架，尚无论文条目，等待社区共同审查与贡献。
  maintainers: [XiaoQiangSHI]
