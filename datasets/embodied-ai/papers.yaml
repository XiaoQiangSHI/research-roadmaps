  - id: gr00t-n1
    title: GR00T N1
    date: 2025-03-18
    arxiv: "2503.14734"
    track: policy
    summary: 提出面向通用人形机器人的开放 VLA 基础模型，统一多源数据和多种机器人本体。
    problem: 单任务策略难以泛化到新环境、新指令和不同本体，机器人真实轨迹规模又有限。
    solution: System 2 VLM 负责视觉语言理解，System 1 Diffusion Transformer 实时生成动作；联合训练真实轨迹、人类视频与合成数据。
