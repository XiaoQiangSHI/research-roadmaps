  - id: prismer
    title: Prismer
    date: 2023-03-04
    arxiv: "2303.02506"
    track: open
    summary: 让视觉语言模型复用深度、边缘、检测、分割、OCR 等冻结视觉专家的知识。
    problem: 普通 VLM 仅靠 RGB，需要用大量数据重新学会已有视觉能力，训练成本高且数据效率低。
    solution: 把六类专家输出经专属 Stem 与 Resampler 压成专家 token，同 RGB token 一起进入视觉编码器，再由语言解码器生成答案。
    institutions:
