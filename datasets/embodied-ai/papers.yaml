  - id: amago
    title: AMAGO
    date: 2023-10-15
    arxiv: "2310.09971"
    track: open
    summary: 把长历史、元强化学习、目标条件 RL 和长期记忆统一到可扩展的上下文强化学习框架中。
    problem: 部分可观测、稀疏奖励和大折扣因子叠加时，长序列 actor-critic 很难稳定训练。
    solution: 用因果 Transformer 编码完整交互历史，共享 Actor/Critic 表征，并结合 Multi-Gamma、PopArt、梯度隔离与多步目标重标记。
    institutions:
