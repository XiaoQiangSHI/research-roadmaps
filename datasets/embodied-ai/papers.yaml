papers:
  - id: minedojo
    title: MineDojo
    date: 2022-06-17
    arxiv: "2206.08853"
    track: open
    summary: 从互联网规模的 Minecraft 视频和知识中学习开放任务的语义，再训练能够真正操作环境的智能体。
    problem: 许多开放式任务很难手写精确奖励，互联网视频又缺少键鼠动作标签。
    solution: 先用视频—字幕训练 MineCLIP 判断行为和文字任务是否匹配，把匹配分数变成奖励，再用 PPO 与自模仿训练 MineAgent。
    institutions:
      primary:
        - nvidia
      collaborators:
        - caltech
        - stanford
    links:
      paper: https://arxiv.org/abs/2206.08853
      blog: https://www.cnblogs.com/sxq-blog/p/22258585
    classification:
      confidence: editorial
      rationale: 该工作的主要贡献与“开放世界、记忆与具身推理”线路最直接相关。
    sources:
      - type: paper
        url: https://arxiv.org/abs/2206.08853
