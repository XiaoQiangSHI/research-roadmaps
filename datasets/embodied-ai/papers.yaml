  - id: scizor
    title: SCIZOR
    date: 2025-05-28
    arxiv: "2505.22626"
    track: data
    summary: 用自监督方法清理大规模模仿学习数据中的次优片段和过度重复。
    problem: 真实示范会混入失败、停顿、碰撞与大量相似片段，数据变多不一定让策略更好。
    solution: 用时间差作为进度标签学习局部次优分数，再联合视觉状态与动作序列相似度做去重，两类删除掩码取并集。
    institutions:
