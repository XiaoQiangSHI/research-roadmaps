  - id: flare
    title: FLARE
    date: 2025-05-21
    arxiv: "2505.15659"
    track: policy
    summary: 在动作生成模型内部加入轻量的隐式世界建模监督。
    problem: 普通策略只拟合“现在该怎么动”，没有被迫理解动作执行后的状态变化，因此泛化与目标感知不足。
    solution: 在 DiT 主序列加入未来 token，使其对齐真实未来观察的 EMA 表征；推理时只生成动作，不需要额外视频生成器。
