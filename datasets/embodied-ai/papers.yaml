  - id: asap
    title: ASAP
    date: 2025-02-03
    arxiv: "2502.01143"
    track: simreal
    summary: 利用真机数据学习动作残差，把真实动力学缺陷反向注入仿真，以获得敏捷人形技能。
    problem: 高动态动作对电机、延迟、柔性等动力学偏差很敏感；参数辨识繁琐，过强随机化又会让动作保守。
    solution: 先在仿真训练跟踪策略，再由真机轨迹学习 Delta Action；冻结 Delta 让仿真复现真实缺陷，并重新优化主策略，部署时只保留主策略。
    institutions:
      primary:
        - cmu
      collaborators:
        - nvidia
    links:
