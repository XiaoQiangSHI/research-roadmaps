  - id: sim-to-real-rl
    title: Sim-to-Real RL
    date: 2025-02-27
    arxiv: "2502.20396"
    track: simreal
    summary: 给出视觉双手灵巧操作的可扩展 Sim-to-Real 强化学习配方。
    problem: 真实随机试错危险昂贵，而复杂双手、接触丰富、视觉驱动的策略很难直接从仿真迁移。
    solution: 自动标定并随机化仿真，在特权状态下训练多个 PPO 专家，只收集成功轨迹，再蒸馏成依赖真实视觉的 Diffusion Policy。
