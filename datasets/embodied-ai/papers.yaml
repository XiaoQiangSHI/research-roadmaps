  - id: mimicplay
    title: MimicPlay
    date: 2023-02-24
    arxiv: "2302.12422"
    track: data
    summary: 把长程模仿学习拆成高层计划和低层控制，让便宜的人类玩耍视频承担规划学习。
    problem: 长任务既需要规划又需要精确控制，如果全部依赖机器人遥操作数据，采集成本会随任务长度迅速增加。
    solution: 用人类视频训练高层规划器产生共享 latent plan，再用少量机器人示范训练低层控制器把计划变成机械臂动作。
    institutions:
      primary:
        - stanford
      collaborators:
        - nvidia
        - georgia-tech
    links:
