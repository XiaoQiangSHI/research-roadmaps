  - id: hover
    title: HOVER
    date: 2024-10-28
    arxiv: "2410.21229"
    track: control
    summary: 把导航、VR、动作捕捉和关节目标等多种控制模式整合进一个人形全身控制器。
    problem: 不同设备给出的命令空间不同，传统方案常为每种模式训练独立策略，难以切换和复用。
    solution: 先以全身运动模仿形成通用能力，再把身体点、关节角和移动命令统一表示，通过多模式策略蒸馏得到单一闭环策略。
    institutions:
