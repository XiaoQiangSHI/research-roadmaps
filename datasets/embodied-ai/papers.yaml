  - id: voyager
    title: Voyager
    date: 2023-05-25
    arxiv: "2305.16291"
    track: agent
    summary: 构建能够在 Minecraft 中自主选任务、写程序、修复失败并持续积累技能的终身学习智能体。
    problem: 开放世界没有固定任务列表，技能容易遗忘，单次 LLM 输出的程序也经常因环境反馈而失败。
    solution: 以自动课程选择合适任务，将成功 JavaScript 保存到可检索技能库，并利用执行错误、环境反馈和自验证反复修改程序。
