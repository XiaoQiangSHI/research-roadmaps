  - id: pdc
    title: PDC
    date: 2025-05-18
    arxiv: "2505.12278"
    track: control
    summary: 研究仅靠第一视角视觉的灵巧人形全身控制，并让主动搜索行为从强化学习中涌现。
    problem: 使用特权 3D 目标会削弱视觉闭环；目标遮挡时，机器人还必须主动移动视角并记住搜索历史。
    solution: 把目标与任务提示画进机器人图像，用 CNN+GRU 读取视觉历史，输出低维意图给运动先验控制器，再由 PPO 联合学习搜索和操作。
