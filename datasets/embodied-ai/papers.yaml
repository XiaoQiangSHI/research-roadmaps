  - id: dreureka
    title: DrEureka
    date: 2024-06-04
    arxiv: "2406.01967"
    track: simreal
    summary: 把 Eureka 的奖励搜索扩展到域随机化设计，自动形成可迁移的 Sim-to-Real 训练配方。
    problem: Sim-to-Real 不仅要设计奖励，还要人工选择物理随机化参数和范围，调试成本很高。
    solution: 先由 LLM 搜索奖励，用 RAPP 测量策略对物理变化的承受范围，再让 LLM 选择合适的域随机化分布训练最终 PPO 策略。
