        url: https://www.cnblogs.com/sxq-blog/p/22258585
  - id: vima
    title: VIMA
    date: 2022-10-06
    arxiv: "2210.03094"
    track: policy
    summary: 提出用图文交错的多模态提示统一描述机器人操作任务，并根据提示和历史预测高层动作。
    problem: 不同操作任务往往需要不同任务接口，模型难以根据新物体、新关系或示例快速改变行为。
    solution: 把文字与物体图片编码成提示 token，用对象级视觉 token 表示场景，再由因果 Transformer 让动作历史持续查询任务提示。
    institutions:
      primary:
        - stanford
    links:
      paper: https://arxiv.org/abs/2210.03094
      blog: https://www.cnblogs.com/sxq-blog/p/22258535
    classification:
      confidence: editorial
      rationale: 该工作的主要贡献与“通用视觉—语言—动作策略”线路最直接相关。
    sources:
