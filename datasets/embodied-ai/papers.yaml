  - id: mimicgen
    title: MimicGen
    date: 2023-10-26
    arxiv: "2310.17596"
    track: data
    summary: 用少量人工示范自动合成大规模、多布局的机器人成功轨迹。
    problem: 模仿学习需要大量成功演示，而逐条遥操耗时昂贵。
    solution: 把示范切成相对操作物体定义的子任务片段，将轨迹变换到新物体位姿后真实执行，只保存成功结果用于策略训练。
