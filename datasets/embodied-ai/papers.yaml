  - id: eureka
    title: Eureka
    date: 2023-10-19
    arxiv: "2310.12931"
    track: agent
    summary: 让大语言模型自动编写和迭代机器人强化学习的奖励函数。
    problem: 奖励工程高度依赖专家，复杂灵巧任务的手工奖励难设计、难调权重。
    solution: LLM 生成多个奖励代码候选，分别运行真实 RL 训练，以任务指标和训练曲线做 Reward Reflection，再进行无梯度进化搜索。
