  - id: sim-and-real-co-training
    title: Sim-and-Real Co-Training
    date: 2025-03-31
    arxiv: "2503.24361"
    track: simreal
    summary: 系统验证真实数据与仿真数据混合训练视觉策略的有效配方。
    problem: 纯真实数据覆盖不足；纯仿真有现实差距；先仿真后微调又可能遗忘仿真带来的泛化。
    solution: 按概率在同一训练过程中混合 Real、任务相关数字近亲和仿真先验，用真实数据校准部署域、仿真数据扩展任务覆盖。
