id: robottt
title: RoboTTT
date: 2026-07-16
arxiv: "2607.15275"
track: open
relatedTracks:
  - policy
summary: 将测试时训练引入机器人基础模型，用固定大小的快权重压缩最长 8K 时间步历史，使策略能利用长程经验而不增加推理延迟。
problem: 短历史 VLA 难以记住多阶段进度、执行失败和上下文演示；保留全部历史的注意力又会让内存与延迟随时间增长，并不保证模型真正利用这些信息。
solution: 在 GR00T N1.7 的 DiT 层中加入 TTT MLP，每步先以梯度更新把历史写入快权重，再用当前查询读取；结合 Sequence Action Forcing、截断反向传播和损失掩码训练 8K 上下文，并通过人类视频与 DAgger 纠正实现一次模仿和在线改进。
