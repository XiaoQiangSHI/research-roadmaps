id: gap
title: GaP
date: 2026-07-06
arxiv: "2607.05369"
track: agent
relatedTracks:
  - simreal
summary: 用多智能体编码框架从自然语言和模块化技能库生成可执行机器人图策略，并通过并行仿真排练自动改进流程。
problem: 固定自动化难以适应物体几何和姿态变化；端到端无模型策略在长期重复的工业任务中又难达到可靠性，并且不易解释和定位失败。
solution: 行为、技能和验证智能体把任务组合成包含感知、规划与控制节点的有向计算图；系统在参数化 Isaac 仿真中并行试跑，依据状态和接触反馈定位失败并迭代修改图结构与参数，最终由边缘执行器闭环运行固定后的图策略。
